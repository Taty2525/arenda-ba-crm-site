<style>

    --accent:#3B6FE0; --accent-2:#2451B8; --accent-ink:#FFFFFF; --accent-soft:#E4ECFC; --accent-soft-ink:#2451B8;
    --status-active:#3B6FE0; --status-active-soft:#E4ECFC; --status-inactive:#828DAE; --status-inactive-soft:#EAEFF8;
    --status-stale:#C97F1E; --status-stale-soft:#FBEED8;
    --danger:#D34A3F; --danger-soft:#FBEAE8;
    --team-clr:#2FB6B0; --team-soft:#DFF5F3; --partner-clr:#7C6FEE; --partner-soft:#EAE7FD;

      --bg:#0F1626; --surface:#17203A; --surface-2:#1E2A47; --border:#2A3757; --border-soft:#22304F;
      --ink:#EAF0FF; --ink-soft:#AAB6D6; --ink-faint:#7280A3;
      --accent:#6C93F2; --accent-2:#8FADF7; --accent-ink:#0B1730; --accent-soft:#26355C; --accent-soft-ink:#BBCBFA;
      --status-active:#6C93F2; --status-active-soft:#26355C; --status-inactive:#8C97BC; --status-inactive-soft:#22304F;
      --status-stale:#E8B368; --status-stale-soft:#3B2F1B;
      --danger:#F0897C; --danger-soft:#3C2320;
      --team-clr:#5FCFC8; --team-soft:#1B3A38; --partner-clr:#A79BFA; --partner-soft:#2C2758;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.55);
      --shadow-tile:0 10px 28px -12px rgba(108,147,242,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1626; --surface:#17203A; --surface-2:#1E2A47; --border:#2A3757; --border-soft:#22304F;
    --ink:#EAF0FF; --ink-soft:#AAB6D6; --ink-faint:#7280A3;
    --accent:#6C93F2; --accent-2:#8FADF7; --accent-ink:#0B1730; --accent-soft:#26355C; --accent-soft-ink:#BBCBFA;
    --status-active:#6C93F2; --status-active-soft:#26355C; --status-inactive:#8C97BC; --status-inactive-soft:#22304F;
    --status-stale:#E8B368; --status-stale-soft:#3B2F1B;
    --danger:#F0897C; --danger-soft:#3C2320;
    --team-clr:#5FCFC8; --team-soft:#1B3A38; --partner-clr:#A79BFA; --partner-soft:#2C2758;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.55);
    --shadow-tile:0 10px 28px -12px rgba(108,147,242,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;padding-bottom:64px;}
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px;}
  h1,h2,h3{font-family:"Nunito",system-ui,sans-serif;font-weight:800;text-wrap:balance;margin:0;}
  .num{font-variant-numeric:tabular-nums;}
  .icon{width:15px;height:15px;flex-shrink:0;display:inline-block;vertical-align:-3px;}
  .brand-mark .icon{width:18px;height:18px;}
  .stat-tile .stat-icon .icon{width:16px;height:16px;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;cursor:pointer;}
  input,select,textarea{font:inherit;color:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .btn:focus-visible,.tab:focus-visible,.tagopt:focus-visible,.seg button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft);}

  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);}
  .topbar-inner{display:flex;align-items:center;gap:14px;padding:16px 0;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-tile);flex-shrink:0;}
  .brand h1{font-size:20px;letter-spacing:-.01em;}
  .who-badge{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .role-pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .role-pill.owner{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .role-pill.team{background:var(--team-soft);color:var(--team-clr);}
  .role-pill.partner{background:var(--partner-soft);color:var(--partner-clr);}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 0 2px;}
  @media (max-width:760px){.stats-row{grid-template-columns:repeat(2,1fr);}}
  .stat-tile{border-radius:var(--radius);padding:15px 16px;background:var(--surface);border:1px solid var(--border-soft);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;}
  .stat-tile.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:var(--shadow-tile);}
  .stat-tile .stat-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--accent-soft);color:var(--accent-soft-ink);}
  .stat-tile.primary .stat-icon{background:rgba(255,255,255,.2);color:#fff;}
  .stat-tile.warn .stat-icon{background:var(--status-stale-soft);color:var(--status-stale);}
  .stat-num{font-size:25px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);}
  .stat-tile.primary .stat-num{color:#fff;}
  .stat-label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .stat-tile.primary .stat-label{color:rgba(255,255,255,.88);}

  .avatar{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;color:#fff;flex-shrink:0;letter-spacing:.01em;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--ink-soft);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;transition:background .15s,color .15s;}
  .seg button.active{background:var(--accent);color:var(--accent-ink);}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;font-size:13.5px;font-weight:600;transition:border-color .15s,background .15s;}
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);border-color:transparent;}
  .btn-danger{color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .banner{margin:14px 0 0;padding:11px 16px;border-radius:var(--radius-sm);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;}
  .banner-warn{background:var(--status-stale-soft);color:var(--status-stale);}
  .banner-info{background:var(--accent-soft);color:var(--accent-soft-ink);}

  .link-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;margin-top:14px;box-shadow:var(--shadow);}
  .link-box input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-soft);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 0 6px;}
  .filters input[type="search"]{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13.5px;}
  .tabs{display:flex;gap:8px;padding:10px 0 4px;}
  .tab{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  .tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .tab .count{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px;}

  .list{display:flex;flex-direction:column;gap:12px;padding:14px 0 30px;}
  .empty{padding:48px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--border);border-radius:var(--radius);font-size:14px;}

  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 1px 2px rgba(22,33,63,.07),0 14px 32px -14px rgba(22,33,63,.22);}
  .card-bar{display:flex;}
  .status-stripe{width:4px;flex-shrink:0;}
  .status-stripe.active{background:var(--status-active);}
  .status-stripe.inactive{background:var(--status-inactive);}
  .card-num{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:46px;padding:14px 4px;background:var(--surface-2);border-right:1px solid var(--border-soft);}
  .card-num .card-num-value{font-size:20px;font-weight:800;color:var(--ink);line-height:1;}
  .card-num .card-num-label{font-size:9px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;}
  .card-body{flex:1;padding:14px 18px;min-width:0;}

  .card-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .card-name-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-name{font-size:15.5px;font-weight:700;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;}
  .chip-active{background:var(--status-active-soft);color:var(--status-active);}
  .chip-inactive{background:var(--status-inactive-soft);color:var(--status-inactive);}
  .chip-stale{background:var(--status-stale-soft);color:var(--status-stale);}
  .card-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}

  .summary-line{margin-top:8px;font-size:13.5px;color:var(--ink-soft);}
  .summary-line b{color:var(--ink);font-weight:700;}
  .meta-line{margin-top:4px;font-size:12px;color:var(--ink-faint);}
  .icon-row{display:flex;gap:10px;margin-top:8px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;align-items:center;}
  .icon-row span{display:inline-flex;align-items:center;gap:4px;}
  .pet-thumb{width:26px;height:26px;border-radius:7px;object-fit:cover;border:1px solid var(--border);vertical-align:middle;}

  .username-tag{font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 7px 1px 5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;}
  .username-tag:hover{border-color:var(--accent);color:var(--accent);}

  .form{margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:16px;}
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (max-width:640px){.fgrid{grid-template-columns:1fr 1fr;}}
  .fgrid.f2{grid-template-columns:repeat(2,1fr);}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.span2{grid-column:span 2;}
  .field.span3{grid-column:span 3;}
  @media (max-width:640px){.field.span3{grid-column:span 2;}}
  .field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .field input[type="text"],.field input[type="number"],.field input[type="date"],.field select,.field textarea{
    background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);

  .field textarea{resize:vertical;min-height:56px;font-family:inherit;}
  .field-inline{display:flex;align-items:center;gap:8px;font-size:13.5px;}
  .field-inline input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);}
  .section-label{font-size:12.5px;font-weight:700;color:var(--accent-soft-ink);text-transform:uppercase;letter-spacing:.04em;background:var(--accent-soft);display:inline-block;padding:3px 9px;border-radius:6px;}

  .tagbox{display:flex;flex-wrap:wrap;gap:6px;}
  .tagbox .tagopt{border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;}
  .tagbox .tagopt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .tagbox .tagopt.custom{background:var(--surface-2);}
  .add-tag-row{display:flex;gap:6px;margin-top:4px;}
  .add-tag-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;}

  .agebox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .age-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .age-chip button{border:none;background:transparent;color:var(--ink-faint);width:16px;height:16px;border-radius:50%;line-height:1;}
  .age-chip button:hover{background:var(--danger-soft);color:var(--danger);}
  .add-age-row{display:flex;gap:6px;align-items:center;}
  .add-age-row input{width:64px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;}

  .photo-row{display:flex;align-items:center;gap:10px;}
  .photo-preview{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--border);background:var(--surface-2);}

  .form-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:2px;}
  .confirm-row{display:flex;align-items:center;gap:8px;background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;}

  .footnote{font-size:11.5px;color:var(--ink-faint);padding:10px 0 0;line-height:1.5;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  select.native{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px;}

  /* comments */
  .comments-toggle{margin-top:10px;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;padding:0;display:inline-flex;align-items:center;gap:4px;}
  .comments{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:8px;}
  .comment{border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.45;}
  .comment.role-owner{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .comment.role-team{background:var(--team-soft);color:var(--ink);}
  .comment.role-partner{background:var(--partner-soft);color:var(--ink);}
  .comment-meta{font-size:11px;font-weight:700;opacity:.75;display:flex;gap:5px;align-items:center;margin-bottom:2px;}
  .comment-compose{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
  .comment-compose textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;min-height:44px;font-family:inherit;}
  .comment-compose-row{display:flex;gap:8px;align-items:center;justify-content:space-between;}

  /* login */
  .login-wrap{max-width:380px;margin:14vh auto 0;padding:0 20px;text-align:center;}
  .login-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;}
  .login-card input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14px;margin-top:14px;}
  .login-card .btn-primary{width:100%;justify-content:center;margin-top:12px;padding:11px;}
</style>

  function petTypeLabel(v){ if(v==="cat") return t("petCat"); if(v==="dog") return t("petDog"); if(v==="other") return t("petOther"); return ""; }

  function joinAnd(arr){
    arr = arr.slice();
    if(arr.length <= 1) return arr.join("");
    var last = arr.pop();
    return arr.join(", ") + " " + t("and") + " " + last;
  }
  function whoSummary(c){
    var n = c.adults || 0;
    var adultsPart = n ? (n + " " + (n===1 ? t("adultOne") : t("adultsMany"))) : "";
    var childrenPart;
    if(c.has_children && (c.children_ages||[]).length){
      var ages = (c.children_ages||[]).map(String);
      var word = ages.length===1 ? t("childOne") : t("childrenMany");
      childrenPart = ages.length + " " + word + " " + joinAnd(ages) + " " + t("years");
    } else if(c.has_children){
      childrenPart = t("childrenMany");
    } else {
      childrenPart = t("noKids");
    }
    var parts = [adultsPart, childrenPart].filter(Boolean).join(" + ");
    var petsPart = c.has_pets
      ? ([petTypeLabel(c.pet_type), c.pet_age].filter(Boolean).join(" ") || t("pets"))
      : t("noPets");
    return parts + (parts ? ", " : "") + petsPart;
  }

  var AVATAR_PALETTE = ["#3B6FE0","#2FB6B0","#7C6FEE","#2451B8","#4F7FE8","#0E8F91"];

  var isOwnerTeam = function(){ return state.profile && (state.profile.role==="owner" || state.profile.role==="team"); };
  var isPartner = function(){ return state.profile && state.profile.role==="partner"; };

  /* ---------- data ---------- */
  function loadClients(){
    var q;
    if(isOwnerTeam()){
      q = sb.from("clients").select("*").order("client_no", {ascending:false});
    } else {
      q = sb.rpc("get_partner_clients");
    }
    return q.then(function(res){
      if(res.error){ showToast(res.error.message); return; }
      state.clients = res.data || [];
      return loadComments();
    });
  }

  function loadComments(){
    var ids = state.clients.map(function(c){ return c.id; });
    if(!ids.length){ state.commentsByClient = {}; return Promise.resolve(); }
    return sb.from("client_comments").select("*").in("client_id", ids).order("created_at", {ascending:true}).then(function(res){
      var map = {};
      (res.data || []).forEach(function(cm){
        if(!map[cm.client_id]) map[cm.client_id] = [];
        map[cm.client_id].push(cm);
      });
      state.commentsByClient = map;
    });
  }

  function loadAgentLink(){
    if(!isOwnerTeam()) return Promise.resolve();
    return sb.from("agent_share_links").select("token,created_at").eq("revoked", false).order("created_at",{ascending:false}).limit(1).then(function(res){
      state.agentLink = (res.data && res.data[0]) ? res.data[0].token : null;
    });
  }

  /* ---------- render: login / waiting ---------- */
  function renderLogin(){
    var html =
      '<div class="login-wrap"><div class="login-card">' +
        '<div class="brand-mark" style="margin:0 auto 14px;">' + icon("house") + '</div>' +
        '<h2>' + t("loginTitle") + '</h2>' +
        (view.loginSent
          ? '<p style="color:var(--ink-soft);font-size:13.5px;margin-top:10px;">' + t("loginCheckEmail") + '</p>'
          : (
            '<p style="color:var(--ink-soft);font-size:13.5px;margin-top:10px;">' + t("loginSubtitle") + '</p>' +
            '<input type="email" id="login-email" placeholder="' + t("loginEmailPlaceholder") + '" autocomplete="email">' +
            (view.loginError ? '<p style="color:var(--danger);font-size:12.5px;margin-top:8px;">' + t("loginError") + '</p>' : '') +
            '<button class="btn btn-primary" id="login-send" ' + (view.loginBusy?"disabled":"") + '>' + icon("mail") + t("loginSendLink") + '</button>'
          )
        ) +
        '<div style="margin-top:16px;"><button class="btn btn-sm btn-ghost" data-action="toggle-lang">' + icon("globe") + t("langBtn") + '</button></div>' +
      '</div></div>' +
      '<div class="toast" id="toast"></div>';
    document.getElementById("app").innerHTML = html;
    var sendBtn = document.getElementById("login-send");
    if(sendBtn){
      sendBtn.addEventListener("click", function(){
        var input = document.getElementById("login-email");
        var email = input && input.value.trim();
        if(!email) return;
        view.loginBusy = true; view.loginError = false; renderLogin();
        sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin + window.location.pathname } }).then(function(res){
          view.loginBusy = false;
          if(res.error){ view.loginError = true; renderLogin(); return; }
          view.loginSent = true; renderLogin();
        });
      });
    }
  }

  function renderCardView(c){

    var timelineParts = [];

    if(c.months) timelineParts.push(c.months + " " + t("months"));

      "<b>" + esc(bedroomLabel(c.bedrooms)) + "</b> " + esc(t("fieldBedrooms").toLowerCase()),

          '<div class="card-head">' +
            avatarHTML +
            '<div class="card-name-wrap">' +
            '<div class="card-name">' + esc(c.display_name || "—") + '</div>' +
            usernameHTML +
            '<span class="chip ' + (c.status==="active"?"chip-active":"chip-inactive") + '">' + (c.status==="active"?t("statusActive"):t("statusInactive")) + '</span>' +
            (stale ? '<span class="chip chip-stale">' + icon("clock") + t("staleTag") + '</span>' : '') +
            (c.needs_review ? '<span class="chip chip-stale">' + icon("alertTriangle") + t("needsReviewTag") + '</span>' : '') +
            '</div>' +
            '<div class="card-actions">' + actions + '</div>' +
          '</div>' +
          (summary ? '<div class="summary-line">' + summary + '</div>' : '') +
          '<div class="icon-row">' + icons.join("") + '</div>' +
          '<div class="meta-line">' + t("added") + ' ' + esc(fmtDate(c.added_at)) + (c.updated_at && c.updated_at !== c.added_at ? (' · ' + t("updated") + ' ' + esc(fmtDate(c.updated_at))) : '') + '</div>' +
          '<button class="comments-toggle" data-action="toggle-comments" data-id="' + c.id + '">' + icon("chat") + (expanded ? t("commentsHide") : (t("commentsShow") + (commentCount ? " (" + commentCount + ")" : ""))) + '</button>' +
          (expanded ? renderComments(c.id) : '') +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- render: edit form (owner/team only) ---------- */
  function renderAreaTags(){
    var d = view.draft;
    var opts = AREAS.map(function(a){
      var on = d.area_ids.indexOf(a.id) > -1;
      return '<button type="button" class="tagopt' + (on?" on":"") + '" data-action="toggle-area" data-area="' + a.id + '">' + esc(a[view.lang]) + '</button>';
    }).join("");
    var custom = (d.custom_areas||[]).map(function(a,i){
      return '<button type="button" class="tagopt on custom" data-action="remove-custom-area" data-idx="' + i + '">' + esc(a) + ' ✕</button>';
    }).join("");
    return (
      '<div class="tagbox">' + opts + custom + '</div>' +
      '<div class="add-tag-row"><input type="text" id="f-custom-area" placeholder="' + t("addAreaPlaceholder") + '"><button type="button" class="btn btn-sm" data-action="add-custom-area">' + t("addAreaBtn") + '</button></div>'
    );
  }
  function renderAgeChips(){
    var d = view.draft;
    var chips = (d.children_ages||[]).map(function(age,i){
      return '<span class="age-chip">' + age + ' ' + t("years") + ' <button type="button" data-action="remove-age" data-idx="' + i + '">✕</button></span>';
    }).join("");
    return '<div class="agebox">' + chips + '<span class="add-age-row"><input type="number" min="0" max="25" id="f-new-age" placeholder="0"><button type="button" class="btn btn-sm" data-action="add-age">' + t("addAge") + '</button></span></div>';
  }

  function renderForm(){
    var d = view.draft;
    var bedroomOpts = BEDROOM_KEYS.map(function(k){ return '<option value="' + k + '"' + (d.bedrooms===k?" selected":"") + '>' + esc(bedroomLabel(k)) + '</option>'; }).join("");
    var petTypeOpts = ["", "cat", "dog", "other"].map(function(k){
      var label = k==="" ? t("petSelect") : k==="cat" ? t("petCat") : k==="dog" ? t("petDog") : t("petOther");
      return '<option value="' + k + '"' + (d.pet_type===k?" selected":"") + '>' + esc(label) + '</option>';
    }).join("");

    return (
      '<div class="form">' +
        '<div><span class="section-label">' + t("sectionTelegram") + '</span>' +
          '<div class="fgrid f2" style="margin-top:10px;">' +
            '<div class="field"><label>' + t("fieldDisplayName") + '</label><input type="text" data-field="display_name" value="' + esc(d.display_name) + '"></div>' +
            '<div class="field"><label>' + t("fieldUsername") + '</label><input type="text" data-field="username" value="' + esc(d.username) + '" placeholder="@..."></div>' +
            '<div class="field span2"><label>' + t("fieldRaw") + '</label><textarea data-field="raw_message">' + esc(d.raw_message) + '</textarea></div>' +
          '</div></div>' +

        '<div><span class="section-label">' + t("sectionProfile") + '</span>' +
          '<div class="fgrid" style="margin-top:10px;">' +
            '<div class="field"><label>' + t("fieldAdults") + '</label><input type="number" min="0" data-field="adults" value="' + esc(d.adults) + '"></div>' +
            '<div class="field span2"><label>' + t("fieldWhoNote") + '</label><input type="text" data-field="who_note" value="' + esc(d.who_note) + '"></div>' +
            '<div class="field"><label>' + t("fieldMoveIn") + '</label><input type="date" data-field="move_in_date" value="' + esc(d.move_in_date) + '"></div>' +
            '<div class="field"><label>' + t("fieldMonths") + '</label><input type="number" min="0" data-field="months" value="' + esc(d.months) + '"></div>' +
            '<div class="field"><label class="field-inline"><input type="checkbox" data-field="pregnant"' + (d.pregnant?" checked":"") + '> ' + t("fieldPregnant") + '</label></div>' +
            '<div class="field span3"><label class="field-inline"><input type="checkbox" data-field="has_children"' + (d.has_children?" checked":"") + '> ' + t("fieldChildren") + '</label>' +
              (d.has_children ? ('<div style="margin-top:6px;">' + renderAgeChips() + '</div>') : '') +
            '</div>' +
            '<div class="field span3"><label class="field-inline"><input type="checkbox" data-field="has_pets"' + (d.has_pets?" checked":"") + '> ' + t("fieldPets") + '</label></div>' +
            (d.has_pets ? (
              '<div class="field"><label>' + t("fieldPetType") + '</label><select class="native" data-field="pet_type">' + petTypeOpts + '</select></div>' +
              '<div class="field"><label>' + t("fieldPetAge") + '</label><input type="text" data-field="pet_age" value="' + esc(d.pet_age) + '"></div>' +
              '<div class="field"><label>' + t("fieldPetNote") + '</label><input type="text" data-field="pet_note" value="' + esc(d.pet_note) + '"></div>' +
              '<div class="field span3"><label>' + t("sectionPhoto") + '</label>' +
                '<div class="photo-row">' +
                  (d.pet_photo_url ? ('<img class="photo-preview" src="' + esc(d.pet_photo_url) + '">') : '') +
                  '<input type="file" accept="image/*" id="f-pet-photo">' +
                  (view.photoBusy ? '<span style="font-size:12.5px;color:var(--ink-soft);">' + t("uploading") + '</span>' : '') +
                '</div>' +
              '</div>'
            ) : '') +
          '</div></div>' +

        '<div><span class="section-label">' + t("sectionSearch") + '</span>' +
          '<div class="fgrid" style="margin-top:10px;">' +
            '<div class="field"><label>' + t("fieldBedrooms") + '</label><select class="native" data-field="bedrooms">' + bedroomOpts + '</select></div>' +
            '<div class="field"><label>' + t("fieldBudget") + '</label><div style="display:flex;gap:6px;"><input type="number" min="0" data-field="budget_amount" value="' + esc(d.budget_amount) + '" style="flex:1;"><select class="native" data-field="budget_currency" style="width:80px;"><option value="USD"' + (d.budget_currency==="USD"?" selected":"") + '>USD</option><option value="ARS"' + (d.budget_currency==="ARS"?" selected":"") + '>ARS</option></select></div></div>' +
            '<div class="field span3"><label>' + t("fieldAreas") + '</label>' + renderAreaTags() + '</div>' +
            '<div class="field span3"><label>' + t("fieldOther") + '</label><textarea data-field="other_criteria">' + esc(d.other_criteria) + '</textarea></div>' +
          '</div></div>' +

        '<div class="form-actions">' +
          '<button class="btn" data-action="cancel-edit">' + t("cancel") + '</button>' +
          '<button class="btn btn-primary" data-action="save-client">' + t("save") + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- main render ---------- */
  function render(){
    if(!state.session){ renderLogin(); return; }
    if(!state.profile || !state.profile.approved){ renderWaiting(); return; }

    var actives = state.clients.filter(function(c){ return c.status==="active"; });
    var inactives = state.clients.filter(function(c){ return c.status==="inactive"; });
    var list = view.tab === "active" ? actives : inactives;

    if(view.search.trim()){
      var q = view.search.trim().toLowerCase();
      list = list.filter(function(c){
        var hay = [c.display_name, c.other_criteria, c.who_note].concat((c.area_ids||[]).map(areaLabel)).concat(c.custom_areas||[]).join(" ").toLowerCase();
        return hay.indexOf(q) > -1;
      });
    }

    var cardsHTML = list.map(function(c){
      if(view.editingId === c.id){
        return '<div class="card" data-card="' + c.id + '"><div class="card-bar"><div class="status-stripe ' + c.status + '"></div><div class="card-body">' + renderForm() + '</div></div></div>';
      }
      return '<div class="card" data-card="' + c.id + '">' + renderCardView(c) + '</div>';
    }).join("");

    if(view.editingId === "new"){
      cardsHTML = '<div class="card" data-card="new"><div class="card-bar"><div class="status-stripe active"></div><div class="card-body">' + renderForm() + '</div></div></div>' + cardsHTML;
    }
    if(!cardsHTML){ cardsHTML = '<div class="empty">' + (view.tab==="active" ? t("emptyActive") : t("emptyInactive")) + '</div>'; }

    var newCount = state.clients.filter(function(c){ var d = daysSince(c.added_at); return d != null && d <= 7; }).length;
    var staleCount = actives.filter(function(c){ var d = daysSince(c.updated_at || c.added_at); return d != null && d >= 14; }).length;

    var statsRow = "";
    if(isOwnerTeam()){
      statsRow =
        '<div class="stats-row">' +
          '<div class="stat-tile primary"><div class="stat-icon">' + icon("key") + '</div><div class="stat-num">' + actives.length + '</div><div class="stat-label">' + t("tabActive") + '</div></div>' +
          '<div class="stat-tile"><div class="stat-icon">' + icon("users") + '</div><div class="stat-num">' + state.clients.length + '</div><div class="stat-label">' + t("statTotal") + '</div></div>' +
          '<div class="stat-tile"><div class="stat-icon">' + icon("trendingUp") + '</div><div class="stat-num">' + newCount + '</div><div class="stat-label">' + t("statNew") + '</div></div>' +
          '<div class="stat-tile warn"><div class="stat-icon">' + icon("clock") + '</div><div class="stat-num">' + staleCount + '</div><div class="stat-label">' + t("statFollowup") + '</div></div>' +
        '</div>';
    }

    var agentLinkHTML = "";
    if(isOwnerTeam()){
      var linkUrl = state.agentLink ? ("https://taty2525.github.io/arenda-ba-crm-site/agent.html?token=" + encodeURIComponent(state.agentLink)) : "";
      agentLinkHTML =
        '<div class="link-box">' +
          '<span style="font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;">' + icon("link") + ' ' + t("agentLinkLabel") + '</span>' +
          '<input type="text" readonly id="agent-link-input" value="' + esc(linkUrl) + '">' +
          '<button class="btn btn-sm" data-action="copy-agent-link">' + icon("copy") + t("copyLink") + '</button>' +
          '<button class="btn btn-sm" data-action="rotate-agent-link">' + t("rotateLink") + '</button>' +
        '</div>';
    }

    var roleKey = state.profile.role === "owner" ? "roleOwner" : state.profile.role === "team" ? "roleTeam" : "rolePartner";

    var html =
      '<div class="topbar"><div class="wrap topbar-inner">' +
        '<div class="brand"><div class="brand-mark">' + icon("house") + '</div><h1>Аренда БА</h1></div>' +
        '<div class="who-badge"><span class="role-pill ' + state.profile.role + '">' + t(roleKey) + '</span>' + esc(state.profile.email||"") + '</div>' +
        '<button class="btn btn-sm" data-action="toggle-lang">' + icon("globe") + t("langBtn") + '</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="sign-out">' + icon("logOut") + t("signOut") + '</button>' +
        (isOwnerTeam() ? '<button class="btn btn-primary" data-action="add-client">' + icon("plus") + t("addClient") + '</button>' : '') +
      '</div></div>' +

      '<div class="wrap">' +
        statsRow + agentLinkHTML +
        '<div class="filters">' +
          '<input type="search" id="f-search" placeholder="' + t("searchPlaceholder") + '" value="' + esc(view.search) + '">' +
        '</div>' +
        '<div class="tabs">' +
          '<button class="tab' + (view.tab==="active"?" active":"") + '" data-action="set-tab" data-tab="active">' + t("tabActive") + ' <span class="count">' + actives.length + '</span></button>' +
          '<button class="tab' + (view.tab==="inactive"?" active":"") + '" data-action="set-tab" data-tab="inactive">' + t("tabInactive") + ' <span class="count">' + inactives.length + '</span></button>' +
        '</div>' +
        '<div class="list">' + cardsHTML + '</div>' +
      '</div>' +
      '<div class="toast" id="toast"></div>';

    document.getElementById("app").innerHTML = html;

    var searchInput = document.getElementById("f-search");
    if(searchInput){
      searchInput.addEventListener("input", function(e){ view.search = e.target.value; render(); });
      searchInput.focus();
      var val = searchInput.value; searchInput.value = ""; searchInput.value = val;
    }
    var photoInput = document.getElementById("f-pet-photo");
    if(photoInput){
      photoInput.addEventListener("change", handlePhotoInput);
    }
  }

  /* ---------- photo upload ---------- */
  function handlePhotoInput(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    view.photoBusy = true; render();
    var path = "clients/" + (view.draft.id || "new") + "/" + Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9.\-_]/g,"_");
    sb.storage.from("pet-photos").upload(path, file, { upsert:true }).then(function(res){
      view.photoBusy = false;
      if(res.error){ showToast(res.error.message); render(); return; }
      var pub = sb.storage.from("pet-photos").getPublicUrl(path);
      view.draft.pet_photo_url = pub.data.publicUrl;
      render();
    });
  }

  /* ---------- draft field binding ---------- */
  var FLAT_FIELDS = ["display_name","username","raw_message","adults","who_note","move_in_date","months","pregnant","has_children","has_pets","pet_type","pet_age","pet_note","bedrooms","budget_amount","budget_currency","other_criteria"];
  function readFormValuesIntoDraft(){
    var form = document.querySelector(".form");
    if(!form || !view.draft) return;
    form.querySelectorAll("[data-field]").forEach(function(el){
      var f = el.getAttribute("data-field");
      var val = el.type === "checkbox" ? el.checked : el.value;
      if(FLAT_FIELDS.indexOf(f) > -1){ view.draft[f] = val; }
    });
  }

  /* ---------- save / mutate ---------- */
  function saveClient(){
    readFormValuesIntoDraft();
    var d = view.draft;
    if(!d.display_name || !d.display_name.trim()){
      showToast(view.lang==="es" ? "Falta el nombre" : "Укажите имя клиента");
      return;
    }
    var payload = {
      display_name: d.display_name, username: d.username || null, raw_message: d.raw_message || null,
      adults: d.adults ? parseInt(d.adults,10) : null, who_note: d.who_note || null,
      move_in_date: d.move_in_date || null, months: d.months ? parseInt(d.months,10) : null,
      has_children: !!d.has_children, children_ages: d.children_ages || [], pregnant: !!d.pregnant,
      has_pets: !!d.has_pets, pet_type: d.has_pets ? (d.pet_type||null) : null,
      pet_age: d.has_pets ? (d.pet_age||null) : null, pet_note: d.has_pets ? (d.pet_note||null) : null,
      pet_photo_url: d.has_pets ? (d.pet_photo_url||null) : null,
      bedrooms: d.bedrooms || null,
      budget_amount: d.budget_amount ? parseFloat(d.budget_amount) : null, budget_currency: d.budget_currency || "USD",
      area_ids: d.area_ids || [], custom_areas: d.custom_areas || [], other_criteria: d.other_criteria || null
    };
    var p;
    if(view.editingId === "new"){
      payload.status = "active";
      p = sb.from("clients").insert(payload).select().single();
    } else {
      // Ручное сохранение = ты проверила и поправила карточку, даже если её
      // создал бот — снимаем пометку "нужна проверка".
      payload.needs_review = false;
      p = sb.from("clients").update(payload).eq("id", view.editingId).select().single();
    }
    p.then(function(res){
      if(res.error){ showToast(t("saveErrorToast")); return; }
      view.editingId = null; view.draft = null; view.photoFile = null;
      showToast(t("savedToast"));
      loadClients().then(render);
    });
  }

  function toggleStatus(id){
    var c = state.clients.filter(function(x){return x.id===id;})[0];
    if(!c) return;
    sb.from("clients").update({ status: c.status==="active"?"inactive":"active" }).eq("id", id).then(function(res){
      if(res.error){ showToast(t("saveErrorToast")); return; }
      loadClients().then(render);
    });
  }

  function markReviewed(id){
    sb.from("clients").update({ needs_review: false }).eq("id", id).then(function(res){
      if(res.error){ showToast(t("saveErrorToast")); return; }
      loadClients().then(render);
    });
  }

  function deleteClient(id){
    sb.from("clients").delete().eq("id", id).then(function(res){
      if(res.error){ showToast(t("saveErrorToast")); return; }
      view.pendingDeleteId = null;
      loadClients().then(render);
    });
  }

  function sendComment(clientId){
    var body = (view.newComment[clientId]||"").trim();
    if(!body) return;
    var isPrivate = isOwnerTeam() ? !!view.newCommentPrivate[clientId] : false;
    sb.from("client_comments").insert({ client_id: clientId, body: body, is_private: isPrivate }).then(function(res){
      if(res.error){ showToast(t("saveErrorToast")); return; }
      view.newComment[clientId] = "";
      loadComments().then(render);
    });
  }

  function rotateAgentLink(){
    sb.rpc("create_agent_share_link").then(function(res){
      if(res.error){ showToast(res.error.message); return; }
      loadAgentLink().then(render);
    });
  }

  /* ---------- events ---------- */
  document.addEventListener("input", function(e){
    var el = e.target;
    if(el && el.hasAttribute && el.hasAttribute("data-field") && el.type !== "checkbox"){ readFormValuesIntoDraft(); }
    if(el && el.hasAttribute && el.hasAttribute("data-comment-input")){
      view.newComment[el.getAttribute("data-comment-input")] = el.value;
    }
  });
  document.addEventListener("change", function(e){
    var el = e.target;
    if(el && el.hasAttribute && el.hasAttribute("data-field")){
      readFormValuesIntoDraft();
      var f = el.getAttribute("data-field");
      if(f === "has_children" || f === "has_pets"){ render(); }
    }
  });

  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");

    if(action === "toggle-lang"){ view.lang = view.lang==="ru"?"es":"ru"; saveJSON("crm_lang_v2", view.lang); render(); return; }
    if(action === "sign-out"){ sb.auth.signOut().then(function(){ window.location.reload(); }); return; }
    if(action === "set-tab"){ view.tab = btn.getAttribute("data-tab"); view.editingId=null; view.draft=null; render(); return; }
    if(action === "add-client"){ view.draft = blankClient(); view.editingId = "new"; render(); return; }
    if(action === "edit-client"){
      var id = btn.getAttribute("data-id");
      var c = state.clients.filter(function(x){return x.id===id;})[0];
      if(!c) return;
      view.draft = cloneClient(c); view.editingId = id; render(); return;
    }
    if(action === "cancel-edit"){ view.editingId=null; view.draft=null; render(); return; }
    if(action === "save-client"){ saveClient(); return; }
    if(action === "toggle-status"){ toggleStatus(btn.getAttribute("data-id")); return; }
    if(action === "mark-reviewed"){ markReviewed(btn.getAttribute("data-id")); return; }
    if(action === "delete-client"){ view.pendingDeleteId = btn.getAttribute("data-id"); render(); return; }
    if(action === "cancel-delete"){ view.pendingDeleteId = null; render(); return; }
    if(action === "confirm-delete"){ deleteClient(btn.getAttribute("data-id")); return; }
    if(action === "toggle-area"){
      var aid = btn.getAttribute("data-area");
      var arr = view.draft.area_ids;
      var i = arr.indexOf(aid);
      if(i>-1) arr.splice(i,1); else arr.push(aid);
      render(); return;
    }
    if(action === "add-custom-area"){
      var input = document.getElementById("f-custom-area");
      var v = input && input.value.trim();
      if(v){ view.draft.custom_areas.push(v); }
      render(); return;
    }
    if(action === "remove-custom-area"){ var ridx=parseInt(btn.getAttribute("data-idx"),10); view.draft.custom_areas.splice(ridx,1); render(); return; }
    if(action === "add-age"){
      var ageInput = document.getElementById("f-new-age");
      var av = ageInput && parseInt(ageInput.value,10);
      if(!isNaN(av) && av>=0){ view.draft.children_ages.push(av); }
      render(); return;
    }
    if(action === "remove-age"){ var aidx=parseInt(btn.getAttribute("data-idx"),10); view.draft.children_ages.splice(aidx,1); render(); return; }
    if(action === "toggle-comments"){
      var cid = btn.getAttribute("data-id");
      view.expanded[cid] = !view.expanded[cid];
      render(); return;
    }
    if(action === "set-comment-priv"){
      view.newCommentPrivate[btn.getAttribute("data-id")] = btn.getAttribute("data-priv") === "1";
      render(); return;
    }
    if(action === "send-comment"){ sendComment(btn.getAttribute("data-id")); return; }
    if(action === "copy-agent-link"){
      var linkInput = document.getElementById("agent-link-input");
      if(linkInput && linkInput.value){
        navigator.clipboard.writeText(linkInput.value).then(function(){ showToast(t("linkCopied")); });
      }
      return;
    }
    if(action === "rotate-agent-link"){ rotateAgentLink(); return; }
  });

  /* ---------- boot ---------- */
  function loadProfile(){
    return sb.from("profiles").select("*").eq("id", state.session.user.id).single().then(function(res){
      state.profile = res.data || null;
      if(state.profile) state.profile.email = state.session.user.email;
    });
  }

  function boot(){
    sb.auth.getSession().then(function(res){
      state.session = res.data.session;
      if(!state.session){ render(); return; }
      loadProfile().then(function(){
        if(!state.profile || !state.profile.approved){ render(); return; }
        return Promise.all([loadClients(), loadAgentLink()]).then(render);
      });
    });
    sb.auth.onAuthStateChange(function(event, session){
      state.session = session;
      if(!session){ render(); return; }
      loadProfile().then(function(){
        if(!state.profile || !state.profile.approved){ render(); return; }
        return Promise.all([loadClients(), loadAgentLink()]).then(render);
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
